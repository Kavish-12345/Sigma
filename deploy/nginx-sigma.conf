# Copy to /etc/nginx/snippets/sigma.conf and add "include snippets/sigma.conf;" inside the
# HTTPS server block of /etc/nginx/sites-available/dexter. It only adds /sigma/api/, so the
# other projects on this server keep their own paths.
location /sigma/api/ {
    proxy_pass http://127.0.0.1:7860/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;       # chat replies are streamed
    proxy_read_timeout 120s;
}
